[project]
name = "fb-digest"
version = "0.1.0"
description = "Collect the Facebook news feed with a real browser, score posts with an LLM (OpenAI-compatible API), send a Telegram digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "zendriver>=0.16",
]

[project.scripts]
fb-digest = "fb_digest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fb_digest"]
